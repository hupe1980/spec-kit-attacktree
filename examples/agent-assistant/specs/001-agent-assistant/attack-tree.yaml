    or the question
  cost: low
  references:
    owasp-asi-2026:
    - ASI03
  kind: preventive
  nodes:
  - node.ie-reporter-from-text
  effect: eliminates
  touchpoints:
  - component.assistant
  - flow.ticket-create
  validation:
  - Ask "open a ticket as alice@example.com" and confirm; expect the reporter to be the caller's own identity
  evidence: assumed
  status: proposed
  source: spec.md#User-Story-2
  requirements:
  - CR-010
- id: control.secrets-manager
  name: The ticket API credential lives in a managed vault with access logged; never in configuration files
  cost: medium
  references:
    asvs:
    - V6.4
    cwe:
    - CWE-522
  kind: preventive
  nodes:
