controls:
- id: control.author-only-publish
  name: The publish path checks the content-author role and denies by default
  cost: low
  references:
    asvs:
    - V4.1
    cwe:
    - CWE-862
  kind: preventive
  nodes:
  - node.pa-unauthorized-publish
  effect: high
  touchpoints:
  - flow.publish
  - component.knowledge-base
  validation:
  - Publish as an employee without the role; expect a rejection and an unchanged knowledge base
  evidence: assumed
  status: proposed
  source: spec.md#FR-003
  requirements:
  - CR-007
- id: control.confirmation-shows-exact-fields
  name: The confirmation prompt shows the exact reporter, summary, and description that will be submitted, and the
    created ticket equals what was shown
  cost: low
  references:
    owasp-asi-2026:
    - ASI09
  kind: preventive
  nodes:
  - node.ft-blind-confirmation
  - node.rrd-ticket-copies
  effect: medium
  touchpoints:
  - component.assistant
  validation:
  - Compare the fields shown at confirmation with the ticket created via the API; expect equality
  evidence: assumed
  status: proposed
  source: spec.md#FR-004
  requirements:
  - CR-004
- id: control.corpus-validation
  name: Ingestion moderates published content for instruction-like text and flags it for review
  cost: medium
  references:
    owasp-llm-2026:
    - LLM05
  kind: detective
  nodes:
  - node.pa-inject-document
  effect: low
  probabilistic: true
  touchpoints:
  - flow.publish
  validation:
  - Publish 50 documents with embedded instructions; record how many are flagged
  evidence: assumed
  status: proposed
  source: spec.md#FR-003
  requirements:
  - CR-009
- id: control.least-privilege-kb-storage
  name: Only the publish path holds write credentials to the knowledge base; the assistant and retrieval are read-only
  cost: medium
  references:
    asvs:
    - V4.2
  kind: preventive
  nodes:
