project:
  id: 001-agent-assistant
  name: Agent Assistant
  description: Internal assistant that answers employee questions from the knowledge base with citations and can
    open support tickets after explicit confirmation.
actors:
- id: actor.content-author
  name: Content author
  description: Publishes documents into the knowledge base; their content later reaches the model as retrieved context.
  archetype: content-author
  capabilities:
    access: user
    resources: minimal
    risk_appetite: medium
    skill: novice
  motivation: Steer answers; open tickets in colleagues' names
  source: spec.md#FR-003
- id: actor.employee
  name: Curious employee
  description: Authenticated through corporate SSO; asks questions and confirms ticket creation.
  capabilities:
    access: user
    resources: minimal
    risk_appetite: low
    skill: intermediate
  motivation: Read documents outside their visibility; file tickets as someone else
  source: spec.md#User-Story-1
- id: actor.operator
  name: Platform operator
  description: Holds credentials for the knowledge-base store and the assistant's configuration.
  archetype: evil-admin
  capabilities:
    access: privileged
    resources: moderate
    risk_appetite: medium
    skill: advanced
  motivation: Alter what the assistant presents as truth; harvest the ticket credential
  source: spec.md#FR-005
- id: actor.outsider
  name: Outside attacker group
  description: Anyone without a valid SSO identity, including a party holding a stolen or expired session; funded
    and willing to break the law.
  archetype: outside-attacker-group
  capabilities:
    access: external
    resources: substantial
    risk_appetite: high
    skill: advanced
  motivation: Sell internal documents; create fraudulent tickets
  source: spec.md#Assumptions
assets:
- id: asset.document
  name: Knowledge-base document
  type: data
  classification: internal
  source: spec.md#Key-Entities
- id: asset.sso-session
  name: SSO session
  type: technical
  classification: secret
  source: spec.md#Assumptions
- id: asset.ticket
  name: Support ticket
  type: business
  classification: internal
  source: spec.md#Key-Entities
- id: asset.ticket-api-credential
  name: Ticket API credential
  type: technical
  classification: secret
  source: spec.md#FR-004
goals:
- id: goal.abuse-ticket-credential
  name: Attacker uses the assistant's ticket API credential beyond creating a ticket
  gate: or
  impact:
    business: high
    data: high
  assets:
  - asset.ticket-api-credential
  - asset.ticket
  status: open
  source: spec.md#FR-004
- id: goal.deny-service
  name: Attacker exhausts assistant capacity for everyone
  gate: or
  impact:
    business: medium
  status: open
  source: spec.md#FR-001
- id: goal.forge-ticket
  name: Attacker creates a ticket the employee never asked for
  gate: or
  impact:
    business: medium
    customer: high
  assets:
  - asset.ticket
  status: open
  source: spec.md#FR-004
- id: goal.impersonate-employee
  name: Attacker acts as another employee towards the assistant or the ticket system
  gate: or
  impact:
    compliance: medium
    customer: high
  assets:
  - asset.sso-session
  - asset.ticket
  status: open
  source: spec.md#Assumptions
- id: goal.poison-answers
  name: Attacker makes the assistant present attacker-chosen content as fact
  gate: or
  impact:
    business: high
    customer: high
  assets:
  - asset.document
  status: open
  source: spec.md#FR-002
- id: goal.read-restricted-documents
  name: Attacker reads documents outside their visibility
  description: Restricted content reaches the model context and leaves it through an answer or a ticket.
  gate: and
  impact:
    compliance: high
    data: critical
  assets:
  - asset.document
  status: open
  source: spec.md#Key-Entities
