  evidence: assumed
  status: proposed
  source: spec.md#FR-003
  requirements:
  - CR-008
- id: control.rate-and-size-limits
  name: Per-employee rate limit and maximum question length enforced before retrieval or generation
  cost: low
  references:
    asvs:
    - V2.2.1
    owasp-llm-2026:
    - LLM06
  kind: preventive
  nodes:
  - goal.deny-service
  effect: high
  touchpoints:
  - component.assistant
  - flow.question
  validation:
  - Exceed the request limit and send an oversized question; expect rejection before retrieval in both cases
  evidence: assumed
  status: proposed
  source: spec.md#FR-001
  requirements:
  - CR-014
- id: control.reporter-from-session
