name: "AttackTree check"
description: "Run AttackTree's deterministic control-chain checks (goals → paths → controls → CR-### → tasks → verification) and the residual-risk simulation on a Spec Kit feature, and optionally upload SARIF to GitHub code scanning."
author: "hupe1980"
branding:
  icon: "git-branch"
  color: "red"

inputs:
  feature-dir:
    description: "Feature directory to check (e.g. specs/007-agent-assistant). Default: auto-detect (SPECIFY_FEATURE, branch name, newest spec)."
    required: false
    default: ""
  format:
    description: "Report format printed to the log: md | json"
    required: false
    default: "md"
  strict:
    description: "Fail on MEDIUM findings too (default fails on HIGH and CRITICAL)"
    required: false
    default: "false"
  scenario:
    description: "Control statuses counted by the simulation: none | current | verified | planned | all"
    required: false
    default: "current"
  fail-on-blocking-goals:
    description: "Fail the job when the simulation reports a goal at risk.block_on residual risk without a decision"
    required: false
    default: "false"
  upload-sarif:
    description: "Upload check findings to GitHub code scanning (requires security-events: write)"
    required: false
    default: "true"
  fail-on-findings:
    description: "Fail the job when the check exit code signals HIGH/CRITICAL (or MEDIUM with strict)"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "Check exit code: 0 nothing above MEDIUM, 1 HIGH (or MEDIUM in strict), 2 CRITICAL"
    value: ${{ steps.check.outputs.exit-code }}
  simulate-exit-code:
    description: "Simulation exit code: 0 no blocking goal, 1 at least one goal at block_on residual risk"
    value: ${{ steps.check.outputs.simulate-exit-code }}
  sarif:
    description: "Path of the generated SARIF file"
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v5

    - name: Run AttackTree check and simulation
      id: check
      shell: bash
      env:
        FEATURE_DIR: ${{ inputs.feature-dir }}
        FORMAT: ${{ inputs.format }}
        STRICT: ${{ inputs.strict }}
        SCENARIO: ${{ inputs.scenario }}
      run: |
        set +e
        engine="${{ github.action_path }}/scripts/python/attacktree.py"
        args=()
        [ -n "$FEATURE_DIR" ] && args+=(--feature-dir "$FEATURE_DIR")
        strict=()
        [ "$STRICT" = "true" ] && strict+=(--strict)
        uv run --quiet --with pyyaml --with jsonschema python "$engine" "${args[@]}" check --format "$FORMAT" "${strict[@]}"
        code=$?
        uv run --quiet --with pyyaml --with jsonschema python "$engine" "${args[@]}" check --format sarif --output attacktree.sarif "${strict[@]}" >/dev/null
        uv run --quiet --with pyyaml --with jsonschema python "$engine" "${args[@]}" simulate --scenario "$SCENARIO" --no-monte-carlo
        sim=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "simulate-exit-code=$sim" >> "$GITHUB_OUTPUT"
        echo "sarif=attacktree.sarif" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: attacktree.sarif
        category: attacktree

    - name: Enforce
      if: ${{ (inputs.fail-on-findings == 'true' && steps.check.outputs.exit-code != '0') || (inputs.fail-on-blocking-goals == 'true' && steps.check.outputs.simulate-exit-code != '0') }}
      shell: bash
      run: |
        echo "::error::AttackTree check exited with code ${{ steps.check.outputs.exit-code }} (1 = HIGH, 2 = CRITICAL); simulation exited with ${{ steps.check.outputs.simulate-exit-code }} (1 = goal at blocking residual risk)"
        code=${{ steps.check.outputs.exit-code }}
        [ "$code" = "0" ] && code=1
        exit $code
