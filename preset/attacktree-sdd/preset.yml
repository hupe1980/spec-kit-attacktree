schema_version: "1.0"

preset:
  id: "attacktree-sdd"
  name: "AttackTree SDD companion"
  version: "0.1.0"
  description: "Appends CR-### awareness to the core tasks, analyze, converge, and checklist commands so control requirements are inventoried and tagged natively"
  author: "hupe1980"
  repository: "https://github.com/hupe1980/spec-kit-attacktree"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tag tasks with [CR-###] for every control requirement"
      replaces: "speckit.tasks"
      strategy: "append"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Inventory CR-### in the coverage analysis"
      replaces: "speckit.analyze"
      strategy: "append"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Inventory CR-### and defer evidence judgment to AttackTree converge"
      replaces: "speckit.converge"
      strategy: "append"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Offer a security-controls checklist built from CR acceptance criteria and control validation steps"
      replaces: "speckit.checklist"
      strategy: "append"

tags:
  - "security"
  - "attacktree"
  - "traceability"
