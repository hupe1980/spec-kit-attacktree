# AttackTree for Spec Kit: landing page and documentation.
# Build: zola --root site build     Preview: zola --root site serve     Links: zola --root site check
base_url = "https://hupe1980.github.io/spec-kit-attacktree"
title = "AttackTree for Spec Kit"
description = "Attack trees for Spec-Driven Development: model attacker goals and AND/OR paths, simulate which security controls cut them, and verify every control with evidence."
default_language = "en"
minify_html = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false

[markdown]
smart_punctuation = true
github_alerts = true
insert_anchor_links = "left"
bottom_footnotes = true
external_links_external = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[link_checker]
internal_level = "error"
external_level = "warn"
skip_prefixes = [
  "https://github.com/hupe1980/spec-kit-attacktree/releases/download/",
  "https://github.com/github/spec-kit/issues/new",
]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 6000

[extra]
repo = "https://github.com/hupe1980/spec-kit-attacktree"
repo_branch = "main"
version = "0.1.0"
author = "hupe1980"
license = "MIT"
og_image = "img/og.png"
install = "specify extension add attacktree --from https://github.com/hupe1980/spec-kit-attacktree/archive/refs/tags/v0.1.0.zip"
docs_groups = ["Get started", "Concepts", "Guides", "Reference", "Project"]
nav = [
  { name = "Docs", path = "@/docs/_index.md" },
  { name = "Quickstart", path = "@/docs/quickstart.md" },
  { name = "Concepts", path = "@/docs/attack-trees.md" },
  { name = "Reference", path = "@/docs/commands.md" },
]
