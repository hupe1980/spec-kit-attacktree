<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ get_url(path='/') }}" aria-label="AttackTree for Spec Kit home">
      {% include "partials/logo.html" %}<span>AttackTree</span><span class="brand-sub">for Spec Kit</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul id="site-nav-list">
        {%- for item in config.extra.nav %}
        {%- set href = get_url(path=item.path) %}
        <li><a href="{{ href }}"{% if current_url and current_url == href %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
        {%- endfor %}
        <li><a href="{{ config.extra.repo }}" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="search-trigger" type="button" data-search-open aria-label="Search the documentation">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="search-label">Search</span><kbd>/</kbd>
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-controls="site-nav-list" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>
